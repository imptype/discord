[build-system]
requires = ['uv_build>=0.8,<0.9']
build-backend = 'uv_build'

[project]
name = 'idiscord'
version = '0.1.1'
description = 'Discord API wrapper'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.15'
dependencies = [
  'aiohttp>=3.14.5',
  'orjson>=3.13.0',
  'pynacl>=1.6.2'
]

[project.urls]
Repository = 'https://github.com/imptype/discord'

[tool.uv.build-backend]
module-name = [
  'discord',
  'discord-stubs'
]
module-root = ''

[dependency-groups]
dev = [
  "ty>=0.0.94",
  "ruff>=0.17.0",
  "uvicorn>=0.54.0",
  "psutil>=7.2.2",
  "pillow>=13.0.0"
]

[tool.ruff]
indent-width = 2
line-length = 120

[tool.ruff.format]
quote-style = 'single'
line-ending = 'lf'

[tool.ruff.lint]
select = [
  'E4', # pycodestyle imports
  'E7', # pycodestyle statements
  'E9', # runtime errors
  'F',  # pyflakes
  'UP', # pyupgrade
  'B'   # flake8-bugbear
]
ignore = [
  'I001' # unsorted imports
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = [
  'F401' # unused import
]
'discord/__init__.py' = [
  'E402' # import not at top of file
]
'*.pyi' = [
  'F401', # unused import
  'E402'  # import not at top of file
]
