[build-system]
requires = ['uv_build>=0.8,<0.9']
build-backend = 'uv_build'

[project]
name = 'idiscord'
version = '0.1.1'
description = 'Discord API wrapper'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.15'
dependencies = ['aiohttp>=3.14.5', 'orjson>=3.13.0']

[project.urls]
Repository = 'https://github.com/imptype/discord'

[project.optional-dependencies]
server = ['uvicorn>=0.54.0', 'pynacl>=1.6.2']
voice = ['pynacl>=1.6.2']
all = ['idiscord[server,voice]']

[tool.uv.build-backend]
module-name = 'discord'
module-root = ''

[dependency-groups]
dev = ['ruff', 'pyright']

[tool.ruff]
indent-width = 2
line-length = 120

[tool.ruff.format]
quote-style = 'single'
line-ending = 'lf'

[tool.ruff.lint]
extend-select = ['I', 'UP', 'B']

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']

[tool.ruff.lint.isort]
lines-after-imports = 1
no-lines-before = ['future', 'standard-library', 'third-party', 'first-party', 'local-folder']

[tool.pyright]
include = ['discord']
