[build-system]
requires = ['uv_build>=0.8,<0.9']
build-backend = 'uv_build'

[project]
name = 'idiscord'
version = '0.1.0'
description = 'Discord API wrapper'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.15'

[project.urls]
Repository = 'https://github.com/imptype/discord'

[tool.uv.build-backend]
module-name = 'discord'
module-root = ''

[dependency-groups]
dev = ['ruff', 'pyright']

[tool.ruff]
indent-width = 2

[tool.ruff.format]
quote-style = 'single'
line-ending = 'lf'

[tool.ruff.lint]
extend-select = ['I', 'UP', 'B']

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401']

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.pyright]
include = ['discord']