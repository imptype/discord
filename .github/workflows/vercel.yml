name: Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: Vercel (Example Deploy)
    steps:
      - uses: actions/checkout@v7
      - run: npm install --global vercel@latest
      - working-directory: examples/deploy/vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} > /dev/null
