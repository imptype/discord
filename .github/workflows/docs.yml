name: Docs
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: GitHub Pages (Docs)
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/deploy-pages@v5
