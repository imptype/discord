name: Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: Cloudflare (Example Deploy)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - working-directory: examples/deploy/cloudflare
        env:
          PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          TOKEN: ${{ secrets.TOKEN }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
        run: |
          printf 'PUBLIC_KEY=%s\nTOKEN=%s\nAPPLICATION_ID=%s\n' "$PUBLIC_KEY" "$TOKEN" "$APPLICATION_ID" > secrets.env
          uv run pywrangler secret bulk secrets.env
          rm secrets.env
      - working-directory: examples/deploy/cloudflare
        run: uv run pywrangler deploy
