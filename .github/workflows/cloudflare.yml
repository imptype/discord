name: Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    environment:
      name: Cloudflare Workers (Example Deploy)
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - working-directory: examples/deploy/cloudflare
        run: uv run pywrangler deploy > /dev/null
